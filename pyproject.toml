[project]
name = "scShapeBench"
version = "0.1.0"
description = "scShapeBench – Benchmark"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "torch-geometric",
]

[project.scripts]
benchmark = "benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scshapebench"]
